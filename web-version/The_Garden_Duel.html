<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8"/>
    <meta content="text/html; charset=utf-8" http-equiv=Content-Type>
    <title>The Garden duel</title>
    <link href="res/logo.ico" rel="icon"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body {
            font-family: arial, serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden
        }

        .emscripten {
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
            text-align: center
        }

        .emscripten_border {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0
        }

        canvas.emscripten {
            border: 0 none;
            background-color: #000
        }

        .spinner {
            height: 30px;
            width: 30px;
            margin: 20px 0 0 20px;
            display: inline-block;
            vertical-align: top;
            -webkit-animation: rotation .8s linear infinite;
            -moz-animation: rotation .8s linear infinite;
            -o-animation: rotation .8s linear infinite;
            animation: rotation .8s linear infinite;
            border-left: 5px solid #ebebeb;
            border-right: 5px solid #ebebeb;
            border-bottom: 5px solid #ebebeb;
            border-top: 5px solid #787878;
            border-radius: 100%;
            background-color: #bdd72e;
            position: fixed;
            z-index: 10
        }

        @keyframes rotation {
            from {
                transform: rotate(0);
            }
            to {
                transform: rotate(360deg);
            }
        }

        #status {
            display: inline-block;
            vertical-align: top;
            margin-top: 30px;
            margin-left: 20px;
            font-weight: 700;
            color: #787878;
            position: fixed;
            z-index: 10
        }

        #progress {
            height: 20px;
            width: 300px
        }
    </style>
</head>
<body>
<div class="spinner" id="spinner"></div>
<div class="emscripten" id="status">Downloading...</div>
<div class="emscripten">
    <progress hidden id="progress" max="100" value="0"></progress>
</div>
<div class="emscripten_border">
    <canvas class="emscripten"
            id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex="-1"
    ></canvas>
</div>
<script>
    const statusElement = document.getElementById("status"),
        progressElement = document.getElementById("progress"),
        spinnerElement = document.getElementById("spinner"),
        canvasElement = document.getElementById("canvas");

    canvasElement.addEventListener(
        "webglcontextlost",
        (e) => {
            alert(
                "WebGL context lost. You will need to reload the page.",
            );
            e.preventDefault();
        },
        false,
    );

    const GAME_W = 1280, GAME_H = 720;

    function resizeCanvas() {
        const vw = window.innerWidth, vh = window.innerHeight;
        const scale = Math.min(vw / GAME_W, vh / GAME_H);
        const w = Math.floor(GAME_W * scale);
        const h = Math.floor(GAME_H * scale);
        canvasElement.style.width = w + "px";
        canvasElement.style.height = h + "px";
    }

    window.addEventListener("resize", resizeCanvas);

    function resizeCanvasBurst() {
        resizeCanvas();
        [0, 50, 150, 300, 600].forEach(ms => setTimeout(resizeCanvas, ms));
    }

    document.addEventListener("fullscreenchange", resizeCanvasBurst);
    window.addEventListener("keydown", (e) => {
        if (e.key === "F11") resizeCanvasBurst();
    });
    resizeCanvas();

    let setStatus = (e) => {
        if (
            (setStatus.last ||
            (setStatus.last = {time: Date.now(), text: ""}),
            e !== setStatus.last.text)
        ) {
            const t = e.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/),
                n = Date.now();
            (t && n - setStatus.last.time < 30) ||
            ((setStatus.last.time = n),
                (setStatus.last.text = e),
                t
                    ? ((e = t[1]),
                        (progressElement.value = 100 * parseInt(t[2])),
                        (progressElement.max = 100 * parseInt(t[4])),
                        (progressElement.hidden = false),
                        (spinnerElement.hidden = false))
                    : ((progressElement.value = null),
                        (progressElement.max = null),
                        (progressElement.hidden = true),
                    e || (spinnerElement.style.display = "none")),
                (statusElement.innerHTML = e));
        }
    };

    var Module = {
        print(...e) {
            console.log(...e);
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(e) {
            this.totalDependencies = Math.max(
                this.totalDependencies,
                e,
            );
            setStatus(
                e
                    ? "Preparing... (" +
                    (this.totalDependencies - e) +
                    "/" +
                    this.totalDependencies +
                    ")"
                    : "All downloads complete.",
            );
        },
    };

    setStatus("Downloading...");
    window.onerror = window.onunhandledrejection = () => {
        setStatus("Exception thrown, see JavaScript console");
        spinnerElement.style.display = "none";
        setStatus = (e) => {
            e && console.error("[post-exception status] " + e);
        };
    };
</script>
<script async src="The_Garden_Duel.js"></script>
</body>
</html>
