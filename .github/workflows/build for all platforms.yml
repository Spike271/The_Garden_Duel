name: Build for all platforms
on:
  push:
    branches: [ "main", "feature" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        build_type: [ Release ]
        cxx_compiler: [ g++, clang++, cl ]   # Now explicitly C++ compilers
        exclude:
          # Linux: cl (MSVC) is not available
          - os: ubuntu-latest
            cxx_compiler: cl
          # macOS: cl (MSVC) not available; we keep clang++ and g++ (available via homebrew)
          - os: macos-latest
            cxx_compiler: cl
          # Windows: g++ and clang++ are available via MSYS2 or LLVM, but we only use MSVC here for simplicity.
          # If you want MinGW or clang-cl, adjust accordingly. For now we keep all, but you may want to remove this exclusion.
          # (No additional exclusions needed; the existing ones are enough.)

    steps:
      - uses: actions/checkout@v4

      # Windows compiler setup (MSVC)
      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest' && matrix.cxx_compiler == 'cl'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ninja -y

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sudo apt install libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -G Ninja
          -S ${{ github.workspace }}
        # Note: CMAKE_C_COMPILER is intentionally omitted – C++ only.

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }}

      - name: Determine Executable Name
        id: exe-name
        shell: bash
        run: |
          EXE_PATH="${{ steps.strings.outputs.build-output-dir }}/PING_PONG"
          RES_PATH="${{ steps.strings.outputs.build-output-dir }}/res"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXE_PATH="${EXE_PATH}.exe"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            EXE_PATH="${EXE_PATH}.app"
          fi
          echo "exe_path=$EXE_PATH" >> $GITHUB_OUTPUT
          echo "res_folder_path=$RES_PATH" >> $GITHUB_OUTPUT

      - name: List build artifacts (Debug)
        run: |
          echo "Build directory contents:"
          ls -R ${{ steps.strings.outputs.build-output-dir }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}-${{ matrix.cxx_compiler }}
          path: |
            ${{ steps.exe-name.outputs.exe_path }}
